# DeepSeek Harness bundle patch for Boss Zhipin Safari AI Recruiting Assistant (招聘助手)
#
# Drives host macOS /Applications/Safari.app via AppleScript — never bundles any browser runtime.
# Uses DeepSeek Harness's native BYO LLM providers, native tool approval cards, bundled skills,
# and optional embedded WebServer workbench (/boss-desk).
- insert:
    - id: boss-recruiter-service
      name: dsh-plugin-boss-recruiter/service
    - id: boss-recruiter-tools
      name: dsh-plugin-boss-recruiter/tools
    - id: boss-recruiter-skill
      name: dsh-plugin-boss-recruiter/skill
    - id: boss-recruiter-web
      name: dsh-plugin-boss-recruiter/web
